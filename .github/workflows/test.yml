name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PRIVACY_NLP_DIR: /tmp/ismanager-nlp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Ubuntu OCR packages
        run: |
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 update -qq
          sudo apt-get install -y antiword catdoc tesseract-ocr-rus tesseract-ocr-eng poppler-utils
      - run: pip install -r requirements.txt pytest playwright
      - run: python -m app.privacy.fetch_models "$PRIVACY_NLP_DIR"
      - run: python scripts/manage.py --help && bash -n install.sh && node --test tests/passgen.test.cjs
      - run: python -m pytest -q tests
      - run: PYTHON=$(command -v python) tests/ldap/run.sh
      - run: PYTHON=$(command -v python) tests/active_directory/run.sh
      - run: CHROMIUM_PATH="$(command -v google-chrome)" python -m tests.live_web
      - run: CHROMIUM_PATH="$(command -v google-chrome)" python -m tests.live_generators
      - run: CHROMIUM_PATH="$(command -v google-chrome)" python -m tests.live_admin_ux
      - run: CHROMIUM_PATH="$(command -v google-chrome)" python -m tests.live_module_views

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install containers and models
        run: |
          umask 077
          ./install.sh --shared-host --no-operator > "$RUNNER_TEMP/ismanager-install.log" 2>&1 || {
            docker compose ps -a
            docker compose logs --tail 25 web worker
            exit 1
          }
          curl -fkSs https://localhost:18443/healthz
      - name: Recognize synthetic audio and video
        run: docker compose run --rm --no-deps -e PYTHONPATH=/opt/ismanager -v "$PWD/tests:/checks:ro" worker python /checks/live_asr.py
      - name: Switch the installed instance between transports
        run: |
          worker=$(docker compose ps -q worker)
          ./install.sh --shared-host --no-operator --access http --bind 127.0.0.1 --port 18084
          curl -fsS http://127.0.0.1:18084/healthz
          ./install.sh --shared-host --no-operator --access proxy --host ismanager.example.org
          curl -fsS -H 'Host: ismanager.example.org' -H 'X-Forwarded-Proto: https' http://127.0.0.1:18084/healthz
          ./install.sh --shared-host --no-operator --access https
          curl -fkSs https://localhost:18443/healthz
          test "$worker" = "$(docker compose ps -q worker)"
      - name: Check LAN HTTP and HTTPS through Nginx in Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/network-test"
          "$RUNNER_TEMP/network-test/bin/pip" install playwright
          export CHROMIUM_PATH="$(command -v google-chrome)"
          web=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q web)")
          worker=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q worker)")
          "$RUNNER_TEMP/network-test/bin/python" -m tests.live_network "$web" "$worker"
      - name: Check local and SMB transcription, SMB redaction and browser batch upload
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome)"
          web=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q web)")
          worker=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q worker)")
          models=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/models"}}{{.Name}}{{end}}{{end}}' "$(docker compose ps -q worker)")
          "$RUNNER_TEMP/network-test/bin/python" -m tests.live_folder_watch "$web" "$worker" "$models"
          "$RUNNER_TEMP/network-test/bin/python" -m tests.live_http_proxy "$web" "$worker" "$models"
      - name: Back up and restore a new installation
        run: |
          docker compose exec -T web sh -c 'echo before > /data/ci-snapshot'
          docker compose exec -T web sh -c 'mkdir -p /data/redaction-batch && echo synthetic > /data/redaction-batch/backup-test'
          ./scripts/manage.py backup
          archive=$(find .runtime/backups -name '*.tar' -type f -print -quit)
          tar -xOf "$archive" data.tar.gz | tar -tzf - > "$RUNNER_TEMP/ismanager-archive-contents"
          if grep -q redaction-batch/backup-test "$RUNNER_TEMP/ismanager-archive-contents"; then exit 1; fi
          docker compose exec -T web sh -c 'echo after > /data/ci-snapshot'
          ./scripts/manage.py restore "$archive"
          test "$(docker compose exec -T web cat /data/ci-snapshot)" = before
          ./scripts/manage.py status
          curl -fkSs https://localhost:18443/healthz
