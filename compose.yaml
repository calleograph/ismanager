name: ismanager
services:
  web:
    image: ${COMPOSE_PROJECT_NAME:-ismanager}-web:${APP_REVISION:-local}
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:?Запустите install.sh}
      DATA_DIR: /data
      ACCESS_MODE: ${ACCESS_MODE:-https}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      PUBLIC_URL: ${PUBLIC_URL:-}
      PUBLIC_PORT: ${PORT:-18443}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    volumes:
      - data:/data
      - watch:/watch:ro
      - ./.runtime/control:/control:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-18443}:8443"
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
  worker:
    image: ${COMPOSE_PROJECT_NAME:-ismanager}-worker:${APP_REVISION:-local}
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      WATCH_POLL_SECONDS: ${WATCH_POLL_SECONDS:-15}
      SECRET_KEY: ${SECRET_KEY:?Запустите install.sh}
    volumes:
      - data:/data
      - models:/models
      - watch:/watch
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
  redactor:
    image: ${COMPOSE_PROJECT_NAME:-ismanager}-web:${APP_REVISION:-local}
    command: ["python", "-m", "app.redaction_worker"]
    environment:
      SECRET_KEY: ${SECRET_KEY:?Запустите install.sh}
      DATA_DIR: /data
      WATCH_POLL_SECONDS: ${WATCH_POLL_SECONDS:-15}
    volumes:
      - data:/data
      - watch:/watch
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "app.redaction_worker", "health"]
      interval: 15s
      timeout: 5s
      start_period: 1m

volumes:
  data:
    name: ${DATA_VOLUME:-ismanager_data}
  models:
  watch:
