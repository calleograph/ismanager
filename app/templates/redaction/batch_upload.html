<form id="batch-upload" method="post" enctype="multipart/form-data" novalidate
      action="{{ url_for('.upload_file',batch_id=batch.id) }}" data-batch-id="{{ batch.id }}"
      data-limit="{{ batch_limit }}" data-formats="{{ formats|join(',') }}" data-empty="{{ empty_hint }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="nonce" value="{{ nonce }}">
  <label>Файлы для обезличивания (до {{ batch_limit//1048576 }} МиБ каждый)<input type="file" name="file" multiple required accept=".{{ formats|join(',.') }}" aria-describedby="batch-upload-error"{% if batch_error %} aria-invalid="true" autofocus{% endif %}></label>
  <p class="notice error" id="batch-upload-error" role="alert">{{ batch_error }}</p>
  <button type="submit">Добавить в пакет</button>
</form>
<p role="status" id="batch-upload-status"></p>
