<section class="panel threat-recent"><h2>Мои анкеты</h2>
  {% for row in rows %}<a class="history-link" href="{{ url_for('.edit',model_id=row.id,step=row.stage) }}"><strong>{{ row.name }}</strong><small>{{ "Документы сформированы" if row.ready else "Шаг " ~ row.stage ~ " из 11" }}</small></a>
  {% else %}<p>Здесь появятся сохранённые анкеты.</p>{% endfor %}
</section>
